<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MICROJOY</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fafafa">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================
         DASHBOARD ATAS — Tiga zon utama
         ============================================ -->
    <header class="dashboard">

        <div class="dash-zone dash-left">
            <div class="brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 32 32" fill="none">
                        <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
                        <circle cx="16" cy="16" r="5" fill="currentColor"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-name">microjoy</span>
                    <span class="brand-version">v1.4</span>
                </div>
            </div>
        </div>

        <div class="dash-zone dash-center">
            <div class="telemetry-stack" id="telemetryStack" data-visible="true">
                <div class="telemetry-item telemetry-mode" id="telemetryMode" hidden>
                    <span class="tel-label">MODE</span>
                    <span class="tel-value" id="modeValue">analog</span>
                </div>
                <div class="telemetry-item telemetry-tx" id="telemetryOut">
                    <span class="tel-label">TX</span>
                    <span class="tel-value">awaiting</span>
                </div>
                <div class="telemetry-item telemetry-rx" id="telemetryIn" hidden>
                    <span class="tel-label">RX</span>
                    <span class="tel-value">—</span>
                </div>
            </div>
        </div>

        <div class="dash-zone dash-right">

            <div class="battery-indicator" id="batteryIndicator" hidden>
                <svg class="battery-ring" viewBox="0 0 44 44">
                    <circle class="battery-ring-bg" cx="22" cy="22" r="18"/>
                    <circle class="battery-ring-fg" id="batteryRing" cx="22" cy="22" r="18"
                            stroke-dasharray="113.097" stroke-dashoffset="113.097"/>
                </svg>
                <div class="battery-content">
                    <span class="battery-percent" id="batteryValue">—</span>
                </div>
            </div>

            <div class="status-pill" id="statusPill">
                <span class="status-dot"></span>
                <span class="status-text" id="status">Offline</span>
            </div>

            <button class="btn-reconnect" id="btnReconnect" hidden aria-label="Reconnect to last device"></button>
            <button class="btn-primary" id="btnConnect">Connect</button>
        </div>

    </header>

    <!-- ============================================
         KAWASAN KAWALAN UTAMA
         ============================================ -->
    <main class="control-area">

        <section class="left-zone" aria-label="Movement controls">
            <div class="joystick" id="joystickHitbox">
                <div class="joystick-base" id="joystickBase">
                    <div class="joystick-thumb" id="thumbstick"></div>
                </div>
            </div>
            <div class="dpad" id="dpadZone" aria-hidden="true">
                <button class="dpad-btn dpad-up" id="btnUp" aria-label="Up">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M12 5l-7 7h4v7h6v-7h4z" fill="currentColor"/></svg>
                </button>
                <button class="dpad-btn dpad-right" id="btnRight" aria-label="Right">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M19 12l-7-7v4H5v6h7v4z" fill="currentColor"/></svg>
                </button>
                <button class="dpad-btn dpad-down" id="btnDown" aria-label="Down">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M12 19l7-7h-4V5h-6v7H5z" fill="currentColor"/></svg>
                </button>
                <button class="dpad-btn dpad-left" id="btnLeft" aria-label="Left">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M5 12l7 7v-4h7v-6h-7V5z" fill="currentColor"/></svg>
                </button>
            </div>
        </section>

        <section class="right-zone" aria-label="Action buttons">
            <button class="btn-action btn-a" id="btnA" aria-label="Button A">A</button>
            <button class="btn-action btn-b" id="btnB" aria-label="Button B">B</button>
        </section>

    </main>

    <!-- ============================================
         CLUSTER UTILITI (Bawah kanan)
         ============================================ -->
    <div class="util-cluster">
        <button class="btn-util" id="btnToggleTelemetry" aria-label="Toggle telemetry display" title="Show/hide telemetry">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="16" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
        </button>
        <button class="btn-util" id="btnToggleMode" aria-label="Toggle joystick or D-pad mode" title="Switch input mode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
            </svg>
        </button>
        <button class="btn-util" id="btnFullscreen" aria-label="Toggle fullscreen" title="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/>
            </svg>
        </button>
    </div>

    <!-- ============================================
         TOAST & DEBUG PANEL
         ============================================ -->
    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <div class="debug-panel" id="debugPanel" hidden>
        <div class="debug-header">
            <span class="debug-title">DEBUG LOG</span>
            <button class="debug-clear" id="debugClear">Clear</button>
            <button class="debug-close" id="debugClose">×</button>
        </div>
        <div class="debug-content" id="debugContent"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
