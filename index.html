<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MICROJOY</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fafafa">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============ HEADER (Status Bar) ============ -->
    <header class="topbar">
        <div class="brand">
            <span class="brand-name">microjoy</span>
            <span class="brand-version">v1.3</span>
        </div>

        <div class="connection">
            <div class="status-pill" id="statusPill">
                <span class="status-dot"></span>
                <span class="status-text" id="status">Offline</span>
            </div>
            <button class="btn-primary" id="btnConnect">Connect</button>
        </div>
    </header>

    <!-- ============ TELEMETRY DISPLAY ============ -->
    <div class="telemetry" id="telemetryOut">
        <span class="telemetry-label">Output</span>
        <span class="telemetry-value">awaiting</span>
    </div>

    <!-- ============ MAIN CONTROL AREA ============ -->
    <main class="control-area">

        <!-- LEFT: Joystick / D-Pad -->
        <section class="left-zone" aria-label="Movement controls">

            <div class="joystick" id="joystickHitbox">
                <div class="joystick-base" id="joystickBase">
                    <div class="joystick-thumb" id="thumbstick"></div>
                </div>
            </div>

            <div class="dpad" id="dpadZone" aria-hidden="true">
                <button class="dpad-btn dpad-up" id="btnUp" aria-label="Up">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M12 5l-7 7h4v7h6v-7h4z" fill="currentColor"/></svg>
                </button>
                <button class="dpad-btn dpad-right" id="btnRight" aria-label="Right">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M19 12l-7-7v4H5v6h7v4z" fill="currentColor"/></svg>
                </button>
                <button class="dpad-btn dpad-down" id="btnDown" aria-label="Down">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M12 19l7-7h-4V5h-6v7H5z" fill="currentColor"/></svg>
                </button>
                <button class="dpad-btn dpad-left" id="btnLeft" aria-label="Left">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M5 12l7 7v-4h7v-6h-7V5z" fill="currentColor"/></svg>
                </button>
            </div>

        </section>

        <!-- RIGHT: Action Buttons -->
        <section class="right-zone" aria-label="Action buttons">
            <button class="btn-action btn-a" id="btnA" aria-label="Button A">A</button>
            <button class="btn-action btn-b" id="btnB" aria-label="Button B">B</button>
        </section>

    </main>

    <!-- ============ UTILITY CLUSTER (Bottom Right) ============ -->
    <div class="util-cluster">
        <button class="btn-util" id="btnToggleMode" aria-label="Toggle joystick or D-pad mode" title="Switch input mode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
            </svg>
        </button>
        <button class="btn-util" id="btnFullscreen" aria-label="Toggle fullscreen" title="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/>
            </svg>
        </button>
    </div>

    <!-- ============ TOAST (Error Messages) ============ -->
    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
